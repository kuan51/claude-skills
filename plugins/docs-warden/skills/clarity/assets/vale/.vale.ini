StylesPath = styles
MinAlertLevel = suggestion

# Front matter title and description are not linted. In a skill or agent file
# the description decides when it is triggered, so rewording it to satisfy a
# prose rule changes behavior. Vale requires this as a core option, above any
# [section]. Setting IgnoredScopes replaces Vale's default rather than adding to
# it, so `code, tt` (inline code) must be listed again or code spans get linted.
IgnoredScopes = code, tt, text.frontmatter.title, text.frontmatter.description

Vocab = Project

# proselint and ai-tells are pinned by release URL. ai-tells rules default to
# error and new releases add rules, so an unpinned sync could start blocking
# commits without any change here.
Packages = Microsoft, write-good, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.35.0/ai-tells.zip

[*.md]
BasedOnStyles = Clarity, Microsoft, write-good, proselint, ai-tells

# Both packages start at warning, so a new repo sees the findings without a blocked
# commit. Vale takes a bare style name as the level for every rule in it. Promote a
# rule once your docs pass it, with a Style.Rule line beside the style:
#   ai-tells.EmDashUsage = error
proselint = warning
ai-tells = warning
Microsoft.DateOrder = warning

# History is not rewritten to satisfy a linter. Decision records are immutable
# once accepted and run logs are append-only, so whole-file linting would force
# edits to old entries. These keep the base styles and skip the newer two.
# Dropping a style from BasedOnStyles is not enough: a `Style = level` or
# `Style.Rule = level` line in [*.md] turns it on in every section, so switch
# the two styles off here too, and add a `Style.Rule = NO` line here for every
# rule you promote above.
[{docs/decisions/**/*.md,**/RUNLOG.md,**/CHANGELOG.md}]
BasedOnStyles = Clarity, Microsoft, write-good
proselint = NO
ai-tells = NO

# Fully generated documents are excluded: linting a file a script owns only
# annoys the person who owns the script. A partly generated file (a generated
# region inside hand-written prose) stays linted -- the prose around the region
# still needs it. The same `NO` lines apply here.
[{docs/DECISIONS.md,docs/decisions/README.md,docs/regulatory/traceability-matrix.md}]
BasedOnStyles = ""
proselint = NO
ai-tells = NO
