# Copy to the repository root. Run `vale sync` once to fetch the packages.
StylesPath = styles
MinAlertLevel = suggestion

# Front matter title and description are not linted. In a skill or agent file
# the description decides when it is triggered, so rewording it to satisfy a
# prose rule changes behavior. Vale requires this as a core option, above any
# [section]. Setting IgnoredScopes replaces Vale's default rather than adding to
# it, so `code, tt` (inline code) must be listed again or code spans get linted.
IgnoredScopes = code, tt, text.frontmatter.title, text.frontmatter.description

Vocab = Project

# proselint and ai-tells are pinned by release URL. ai-tells rules default to
# error and new releases add rules, so an unpinned sync could start blocking
# commits without any change here.
Packages = Microsoft, write-good, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.35.0/ai-tells.zip

[*.md]
BasedOnStyles = Clarity, Microsoft, write-good, proselint, ai-tells

# Rules switched off deliberately. Each was observed firing on real project
# documentation and judged wrong for this context, not merely noisy.
#
# Contractions: it wants "didn't" for "did not". In a safety instruction the
#   contraction is weaker and easier to misread. This one would do harm.
# Terms: Microsoft's product vocabulary. It reads our "agent" as shorthand for
#   "personal digital assistant".
# We: our CONVENTIONS and decision records are deliberately first person plural;
#   naming who decided is the point of a decision record.
# E-Prime: bans every form of "to be". A whole-language prohibition nobody is
#   going to follow, and following it would make technical prose worse.
Microsoft.Contractions = NO
Microsoft.Terms = NO
Microsoft.We = NO
write-good.E-Prime = NO

# Downgraded to warning: each fired at error level on wording that was already
# accurate, so fixing it would have made the text wrong. Examples: a skill that
# really does ask the user (AnthropomorphicCognition), an established term like
# "clinically meaningful" (OverusedVocabulary), a quoted eval prompt (FigurativeWins),
# bold step titles (MicDrop), "any path it is given" (EmptyPadding), the CFR
# citation "170.14(c)(4)" (Typography) and "ISO/IEC 27002:2022" (DateOrder).
# Also: "No certificate, no assessor" (ContrastiveNegation), ISO's term
# "implementation status" (FormalRegister), "for example" before a list of
# examples (FormalTransitions) and "No primary source was reachable" (NegatedSubject).
ai-tells.AnthropomorphicCognition = warning
ai-tells.ContrastiveNegation = warning
ai-tells.EmptyPadding = warning
ai-tells.FigurativeWins = warning
ai-tells.FormalRegister = warning
ai-tells.FormalTransitions = warning
ai-tells.MicDrop = warning
ai-tells.NegatedSubject = warning
ai-tells.OverusedVocabulary = warning
# Three concrete examples in a list (VerbTricolon), and "the very first line",
# which the fabflows tests require word for word (Very).
ai-tells.VerbTricolon = warning
proselint.Very = warning
Microsoft.DateOrder = warning
proselint.Typography = warning

# History is not rewritten to satisfy a linter. Decision records are immutable
# once accepted, run logs are append-only, and changelogs and dated plans record
# what was true then. Whole-file linting would force edits to old entries, so
# these keep the base styles and skip proselint and ai-tells.
[{docs/decisions/**/*.md,**/RUNLOG.md,**/CHANGELOG.md,docs/superpowers/**/*.md}]
BasedOnStyles = Clarity, Microsoft, write-good

# Test fixtures are sample repositories the docs-warden tests read. Rewording
# them changes test input, so they also skip the two newer packages.
[plugins/docs-warden/test/fixtures/**/*.md]
BasedOnStyles = Clarity, Microsoft, write-good

# The clarity skill's worked examples quote bad prose on purpose, to show what
# each rule catches. Linting them would flag the very examples they illustrate.
[plugins/docs-warden/skills/clarity/examples/before-after.md]
BasedOnStyles = ""

# The docs-warden eval prompts are test inputs quoted word for word. Rewording
# one to satisfy a prose rule would change what the eval tests.
[plugins/docs-warden/evals/README.md]
BasedOnStyles = Clarity, Microsoft, write-good

# The glossary lists its own rejected terms in the "Do not use" column, so the
# substitution rule would flag the source it was generated from.
[docs/GLOSSARY.md]
Clarity.GlossaryTerms = NO

# Fully generated documents: linting a file a script owns only annoys the
# script's author. Keep this list in step with generated_docs entries that
# cover the WHOLE file. A partially generated document (e.g. README.md, where
# only the plugin table between BEGIN/END GENERATED markers is generated)
# stays linted here - the hand-written prose around the generated region still
# needs it, and exempting the file would silently disable linting on the rest.
[docs/DECISIONS.md]
BasedOnStyles = ""

[docs/decisions/README.md]
BasedOnStyles = ""

[docs/regulatory/traceability-matrix.md]
BasedOnStyles = ""
