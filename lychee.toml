# Copy to the repository root.

# Checks relative links, anchors and external URLs. Network is required; a
# broken in-repo path is the failure that matters most and is caught either way.
offline = false
require_https = false

max_retries = 2
timeout = 20

# Rate limiting is not a broken link.
accept = ["200..=299", "429"]

exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://.*\\.internal",
  "^https?://.*\\.local",
  "^mailto:",
]

exclude_path = [
  "node_modules",
  ".venv",
  "styles",
]
